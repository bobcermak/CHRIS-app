[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Vít Dobrovský", email = "dobrovsky.vit@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
